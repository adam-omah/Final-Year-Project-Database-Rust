<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Frontend</title>
    <style>
        /* Basic styles */
        body { display: flex; font-family: Arial, sans-serif; margin: 0; height: 100vh; }
        #sidebar { width: 200px; background: #f5f5f5; padding: 10px; box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);}
        #content { flex: 1; padding: 20px; overflow-y: auto; }
        #query-box { width: 100%; height: 100px; margin-bottom: 10px; font-family: monospace; }
        button { padding: 10px 15px; margin-bottom: 10px; background: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
<div id="sidebar">
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/tables">Tables</a></li>
    </ul>
</div>

<div id="content">
    <textarea id="query-box" placeholder="Enter SQL query here..."></textarea>
    <button id="execute-query">Execute</button>
    <div id="output-section">
        <!-- Area to display results -->
        <div id="error-message" class="error" style="display: none;"></div>
        <table id="result-table" style="display: none;">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    // Query execution logic
    document.getElementById('execute-query').addEventListener('click', async () => {
        const queryText = document.getElementById('query-box').value.trim();
        const errorMessageDiv = document.getElementById('error-message');
        const resultTable = document.getElementById('result-table');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        // Clear previous results or errors
        errorMessageDiv.style.display = 'none';
        resultTable.style.display = 'none';
        errorMessageDiv.textContent = '';
        tableHead.innerHTML = '';
        tableBody.innerHTML = '';

        if (!queryText) {
            errorMessageDiv.style.display = 'block';
            errorMessageDiv.textContent = 'Query cannot be empty.';
            return;
        }
        try {
            // Send query to backend
            const response = await fetch('/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(queryText), // Send raw query as JSON payload
            });
            if (!response.ok) {
                const error = await response.text();
                throw new Error(error);
            }
            const result = await response.json();

            // Check if the result is a message (object with a "message" field)
            if (result.message) {
                errorMessageDiv.style.display = 'block';
                errorMessageDiv.textContent = result.message; // Display the message
                return; // No further processing needed
            }

            // If the result is an array (assumed table rows), process it
            if (!Array.isArray(result) || result.length === 0) {
                errorMessageDiv.style.display = 'block';
                errorMessageDiv.textContent = 'Query returned no results.';
                return;
            }

            // Generate table headers from first row keys
            const headers = Object.keys(result[0] || {});
            const headerRow = document.createElement('tr');
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            tableHead.appendChild(headerRow);

            // Generate table rows
            result.forEach(row => {
                const rowElement = document.createElement('tr');
                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.textContent = row[header] ?? 'NULL';
                    rowElement.appendChild(td);
                });
                tableBody.appendChild(rowElement);
            });

            // Show results
            resultTable.style.display = 'table';
        } catch (error) {
            errorMessageDiv.style.display = 'block';
            errorMessageDiv.textContent = `Error: ${error.message}`;
        }
    });
</script>
</body>
</html>
