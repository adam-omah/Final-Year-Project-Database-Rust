<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div id="sidebar">
    <div class="button-container">
        <button onclick="location.href='/'" class="nav-button">Home</button>
        <button onclick="location.href='/tables'" class="nav-button">Tables</button>
        <button onclick="location.href='/replication'" class="nav-button active">Replication</button>
        <button onclick="location.href='/admin'" class="nav-button active">Admin</button>
    </div>
    <div class="sidebar-footer">
        <button id="logout-button" class="sidebar-logout-btn">
            <i class="icon-logout"></i> Logout
        </button>
    </div>
</div>

<div id="content">
    <h1>Database Tables</h1>
    <ul id="tables-list">
        <!-- List of tables will be dynamically populated here -->
    </ul>
</div>

<script>
    // user logged in check
    document.addEventListener('DOMContentLoaded', () => {
        const userInfo = localStorage.getItem('userInfo');

        if (!userInfo) {
            window.location.href = '/login-page';
            return;
        }

        const originalFetch = window.fetch; // Store original fetch
        window.fetch = async (url, options = {}) => {
            const userInfo = JSON.parse(localStorage.getItem('userInfo'));
            if (userInfo && userInfo.username && userInfo.password_hash) {
                const encodedCredentials = btoa(`${userInfo.username}:${userInfo.password_hash}`);
                options.headers = {
                    ...options.headers,
                    'Authorization': `Basic ${encodedCredentials}`
                };
            }

            const response = await originalFetch(url, options); // Use originalFetch here

            if (response.status === 401) {
                localStorage.removeItem('userInfo');
                window.location.href = '/login-page';
                return null;
            }

            return response;
        };

        const tablesList = document.getElementById('tables-list');

        (async () => {
            console.log("userInfo on tables.html:", localStorage.getItem('userInfo'));
            try {
                const response = await fetch('/api/tables');
                if (!response.ok) {
                    throw new Error(`Failed to fetch tables: ${response.statusText}`);
                }
                const tables = await response.json();

                tables.forEach(tableName => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = `/tables/${tableName}`;
                    link.textContent = tableName;
                    listItem.appendChild(link);
                    tablesList.appendChild(listItem);
                });
            } catch (error) {
                const errorMessage = document.createElement('p');
                errorMessage.textContent = `Error: ${error.message}`;
                errorMessage.className = 'error'; // Add class for styling
                tablesList.appendChild(errorMessage);
            }
        })();
    });
    document.getElementById('logout-button')?.addEventListener('click', () => {
        // Remove stored user credentials and information
        localStorage.removeItem('userInfo');
        localStorage.removeItem('credentials');

        // Redirect to login page
        window.location.href = '/login-page';
    });
</script>
</body>
</html>
